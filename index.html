<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIST Analyzer</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    padding: 15px;
    margin: 0;
}

.container {
    max-width: 500px;
    margin: auto;
}

.input-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
}

/* TOP BUTTONS */
.top-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.top-buttons + .top-buttons {
    margin-top: -2px;
}

.top-buttons button {
    flex: 1;
    background: #1e40af;
    min-width: 0;
    padding: 10px 8px;
    font-size: 0.95rem;
    line-height: 1.15;
}

/* suggestions */
#suggestions {
    background: #1e293b;
    border-radius: 10px;
    margin-top: 5px;
    max-height: 200px;
    overflow-y: auto;
}

.suggestion-item {
    padding: 10px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
}

.suggestion-item:hover {
    background: #334155;
}

/* card */
.card {
    margin-top: 20px;
    padding: 15px;
    background: #1e293b;
    border-radius: 10px;
}

.big {
    font-size: 22px;
}

.green { color: #22c55e; }
.red { color: #ef4444; }
.orange { color: #f59e0b; }
.delta-up { color: #22c55e; font-weight: 700; margin-left: 2px; }
.delta-down { color: #ef4444; font-weight: 700; margin-left: 2px; }

/* bar */
.bar-container {
    width: 100%;
    height: 10px;
    background: #334155;
    border-radius: 10px;
    margin-top: 5px;
}

.bar {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(to right, #ef4444, #f59e0b, #22c55e);
}

/* list */
.list-item {
    background: #1e293b;
    margin-top: 8px;
    padding: 10px;
    border-radius: 8px;
}

.score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}

.signal {
    font-size: 16px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 10px;
    background: #334155;
}
.green-bg { background: rgba(34,197,94,0.2); }
.orange-bg { background: rgba(245,158,11,0.2); }
.red-bg { background: rgba(239,68,68,0.2); }
.hisse-link {
    color: #60a5fa;
    cursor: pointer;
    font-weight: bold;
}

.hisse-link:hover {
    text-decoration: underline;
}

</style>
</head>
<body>

<div class="container">

<h2>📊 BIST Analyzer</h2>

<div class="top-buttons">
    <button onclick="showTop(10)">Tüm Hisseler</button>
    <button onclick="showPortfolio()">Hisselerim</button>
    <button onclick="showLargeCaps(50, 100)">Güçlü Büyükler</button>
    <button onclick="showBanks(20)">Bankalar</button>
</div>

<div class="top-buttons">
    <button onclick="showRecentBilancos()">Son Bilançolar</button>
    <button onclick="showByAnalyst()">👨‍💼 Analist Sıralaması</button>
    <button onclick="showByTakas()">📦 Takas Sıralaması</button>
    <button onclick="showZenginlik()">💸 Zenginlik</button>
</div>

<div class="input-row">
    <input id="symbol" placeholder="Hisse gir">
    <button onclick="search()">Analiz Et</button>
</div>

<div id="suggestions"></div>
<div id="result"></div>
<div id="toplist"></div>

</div>

<script>

let data = [];
let livePrices = {};
let activeListMode = null;
let infiniteListItems = [];
let infiniteRenderedCount = 0;
const infiniteBatchSize = 10;
const portfolioSourceBase = "https://dl.dropboxusercontent.com/scl/fi/7cr2pg6akumfs3h0uhn5f/hisselerim.json?rlkey=5fmcv4x84m1cn247gfq2uhi6s";
const dataSourceBase = "https://dl.dropboxusercontent.com/scl/fi/eiyktxtdnm3jp32hvqnev/data.json?rlkey=my50wvz5dkox9ss3v7j9cvn7e";
const dataRefreshWindowMs = 5 * 60 * 1000;
let portfolioHoldings = null;
let portfolioWarmStarted = false;
let pricesLoaded = false;

async function loadData() {
    const source = new URL(dataSourceBase);
    source.searchParams.set("_v", String(Math.floor(Date.now() / dataRefreshWindowMs)));

    try {
        const res = await fetch(source.toString(), { cache: "default" });
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const text = await res.text();
        const json = JSON.parse(text);

        if (Array.isArray(json) && json.length) {
            console.log("DATA SOURCE:", source.toString());
            console.log("DATA LENGTH:", json.length);
            data = json;
            showTop(10);
            requestAnimationFrame(() => {
                schedulePriceLoad();
            });
            return;
        }
    } catch (e) {
        console.error("LOAD ERROR:", source.toString(), e);
    }

    console.error("No valid data source found");
}

function schedulePriceLoad() {
    if (pricesLoaded) return;
    if ("requestIdleCallback" in window) {
        window.requestIdleCallback(() => loadPrices(), { timeout: 2000 });
    } else {
        setTimeout(() => loadPrices(), 250);
    }
}

function schedulePortfolioWarmup() {
    if (portfolioHoldings || portfolioWarmStarted) return;
    portfolioWarmStarted = true;

    const warm = () => {
        loadPortfolioHoldings().catch((e) => {
            console.error("portfolio warmup error", e);
            portfolioWarmStarted = false;
        });
    };

    if ("requestIdleCallback" in window) {
        setTimeout(() => {
            window.requestIdleCallback(warm, { timeout: 4000 });
        }, 1500);
    } else {
        setTimeout(warm, 2000);
    }
}

loadData();
/* helpers */
function formatPortfolioQty(value) {
    const qty = Number(value) || 0;
    return Number.isInteger(qty)
        ? qty.toLocaleString("tr-TR")
        : qty.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function buildPortfolioHoldings(transactions = []) {
    const totals = new Map();
    transactions.forEach(tx => {
        const symbol = String(tx?.symbol || "").trim().toUpperCase();
        const qty = Number(tx?.quantity) || 0;
        if (!symbol || !qty) return;
        const sign = String(tx?.type || "").toUpperCase() === "SELL" ? -1 : 1;
        totals.set(symbol, (totals.get(symbol) || 0) + sign * qty);
    });
    return new Map([...totals.entries()].filter(([, qty]) => qty > 0));
}

async function loadPortfolioHoldings() {
    if (portfolioHoldings) return portfolioHoldings;
    const source = new URL(portfolioSourceBase);
    source.searchParams.set("_ts", String(Date.now()));
    const res = await fetch(source.toString(), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    portfolioHoldings = buildPortfolioHoldings(json?.transactions || []);
    return portfolioHoldings;
}

function getDisplayFk(stock, livePriceOverride = null) {
    const livePrice = Number(livePriceOverride ?? livePrices[stock?.Kod] ?? stock?.Fiyat);
    const sermaye = Number(stock?.Sermaye);
    const netKarTtm = Number(stock?.NetKar_TTM);

    if (
        Number.isFinite(livePrice) && livePrice > 0 &&
        Number.isFinite(sermaye) && sermaye > 0 &&
        Number.isFinite(netKarTtm) && netKarTtm > 0
    ) {
        const marketCap = (livePrice * sermaye) / 1e6;
        return marketCap / netKarTtm;
    }

    const baseFk = Number(stock?.fk);
    return Number.isFinite(baseFk) && baseFk > 0 ? baseFk : null;
}

function getDisplayPdDd(stock, livePriceOverride = null) {
    const livePrice = Number(livePriceOverride ?? livePrices[stock?.Kod] ?? stock?.Fiyat);
    const sermaye = Number(stock?.Sermaye);
    const ozSermaye = Number(stock?.oz_sermaye);

    if (
        Number.isFinite(livePrice) && livePrice > 0 &&
        Number.isFinite(sermaye) && sermaye > 0 &&
        Number.isFinite(ozSermaye) && ozSermaye > 0
    ) {
        const marketCap = (livePrice * sermaye) / 1e6;
        return marketCap / ozSermaye;
    }

    const basePdDd = Number(stock?.PD_DD);
    return Number.isFinite(basePdDd) && basePdDd > 0 ? basePdDd : null;
}

function usesRoeProfitability(stock) {
    const sektor = String(stock?.Sektor || "");
    return [
        "Bank",
        "Varlık Yönetimi",
        "Finansal Kiralama",
        "Aracı Kurum",
        "Sigorta",
        "Tasarruf Finansman"
    ].some(key => sektor.includes(key));
}

function getProfitabilityText(stock) {
    if (usesRoeProfitability(stock)) {
        const roe = Number(stock?.ROE);
        if (Number.isFinite(roe)) {
            const label =
                roe > 0.25 ? "çok yüksek" :
                roe > 0.18 ? "yüksek" :
                roe > 0.10 ? "iyi" :
                roe > 0.05 ? "orta" :
                roe > 0 ? "zayıf" :
                "negatif";
            return `📊 Kârlılık: ${(roe * 100).toFixed(1)}% (${label})`;
        }
        return "📊 Kârlılık: NA";
    }

    const margin = Number(stock?.Net_Margin);
    if (!Number.isFinite(margin)) {
        return "📊 Kârlılık: NA";
    }

    const boundedMargin = Math.max(-1, Math.min(1, margin));
    const label =
        boundedMargin > 0.20 ? "çok yüksek" :
        boundedMargin > 0.10 ? "yüksek" :
        boundedMargin > 0.05 ? "iyi" :
        boundedMargin > 0 ? "zayıf" :
        "negatif";

    return `📊 Kârlılık: ${(boundedMargin * 100).toFixed(1)}% (${label})`;
}

function getFiiliDolasimText(stock) {
    const ratio = Number(stock?.FiiliDolasimOranPct);
    if (!Number.isFinite(ratio)) return "🔄 Fiili Dolaşım: NA";
    let color = "#e5e7eb";
    if (isFiiliDolasimGreen(stock)) {
        color = "#22c55e";
    } else if (ratio > 60) {
        color = "#ef4444";
    }
    return `🔄 <span style="color:${color};">Fiili Dolaşım: ${ratio.toFixed(2)}%</span>`;
}

function getIlkKurumSaklamaText(stock) {
    const ratio = Number(stock?.IlkKurumSaklamaOraniPct);
    const kurum = String(stock?.IlkKurumSaklamaKurum || "").trim();
    if (!Number.isFinite(ratio)) return "🏛️ İlk Kurum Saklama: NA";
    const color = isIlkKurumSaklamaGreen(stock) ? "#22c55e" : "#e5e7eb";
    if (kurum) {
        return `🏛️ <span style="color:${color};">İlk Kurum Saklama: ${ratio.toFixed(2)}% (${kurum})</span>`;
    }
    return `🏛️ <span style="color:${color};">İlk Kurum Saklama: ${ratio.toFixed(2)}%</span>`;
}

function getTakasAnalizText(stock) {
    const strongest = getStrongestTakasChange(stock);
    if (!strongest) return "📦 Takas: NA";
    const deltaPct = strongest.pct;
    if (Math.abs(deltaPct) < 0.01) return "📦 Takas: sabit";

    let text = "sabit";
    let color = "#e5e7eb";

    if (isTakasGreen(stock)) {
        text = "kurum topluyor gibi";
        color = "#22c55e";
    } else if (deltaPct > 0) {
        text = "hafif pozitif";
    } else if (deltaPct < -0.2) {
        text = "kurum çıkışı var";
        color = "#ef4444";
    } else if (deltaPct < 0) {
        text = "hafif negatif";
        color = "#ef4444";
    }

    const sign = deltaPct > 0 ? "+" : "-";
    return `📦 <span style="color:${color};">Takas: ${text} (${sign}%${Math.abs(deltaPct).toFixed(2)} ${strongest.label})</span>`;
}

function isFiiliDolasimGreen(stock) {
    const ratio = Number(stock?.FiiliDolasimOranPct);
    return Number.isFinite(ratio) && ratio < 25;
}

function isIlkKurumSaklamaGreen(stock) {
    const ratio = Number(stock?.IlkKurumSaklamaOraniPct);
    return Number.isFinite(ratio) && ratio > 50;
}

function isTakasGreen(stock) {
    const strongest = getStrongestTakasChange(stock);
    return strongest && Number.isFinite(strongest.pct) && strongest.pct > 0.2;
}

function getStrongestTakasChange(stock) {
    const haftalik = Number(stock?.IlkKurumHaftalikDegisim);
    const aylik = Number(stock?.IlkKurumAylikDegisim);
    const gunluk = Number(stock?.IlkKurumGunlukDegisim);
    const sonLot = Number(stock?.IlkKurumSonLot);
    const currentRatio = Number(stock?.IlkKurumSaklamaOraniPct);

    if (![haftalik, aylik, gunluk].some(Number.isFinite)) return null;
    if (!(Number.isFinite(sonLot) && sonLot > 0 && Number.isFinite(currentRatio) && currentRatio > 0)) return null;

    const estimatedTotalLot = sonLot / (currentRatio / 100);
    const periods = [
        { label: "günlük", raw: gunluk },
        { label: "haftalık", raw: haftalik },
        { label: "aylık", raw: aylik }
    ]
        .filter(x => Number.isFinite(x.raw) && x.raw !== 0)
        .map(x => ({
            ...x,
            pct: (x.raw / estimatedTotalLot) * 100,
            absPct: Math.abs((x.raw / estimatedTotalLot) * 100)
        }))
        .sort((a, b) => b.absPct - a.absPct);

    return periods[0] || null;
}

function normalize(score) {
    return Math.max(0, Math.min(100, score * 100));
}

function normalizeKararLabel(karar) {
    const text = String(karar || "").trim().toUpperCase();
    const compact = text
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^A-Z ]+/g, "")
        .replace(/\s+/g, " ")
        .trim();

    if (
        text === "G??L? AL" ||
        text === "GÜÇLÜ AL" ||
        text === "GĂŚĂ‡LĂŚ AL" ||
        compact === "GL AL"
    ) return "GÜÇLÜ AL";

    if (
        text === "N?TR" ||
        text === "NÖTR" ||
        text === "NĂ–TR" ||
        compact === "NTR"
    ) return "NÖTR";

    if (text === "AL") return "AL";
    if (text === "TUT") return "TUT";
    if (text === "ZAYIF") return "ZAYIF";
    if (text === "SAT") return "SAT";

    return text || "NÖTR";
}

function getColor(karar) {
    karar = normalizeKararLabel(karar);
    if (karar === "GÜÇLÜ AL" || karar === "AL") return "green";
    if (karar === "TUT" || karar === "NÖTR") return "orange";
    return "red";
}
async function getLivePrice(symbol) {
    try {
        // 1️⃣ Yahoo
        let res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}.IS`);
        let json = await res.json();

        let price = json?.chart?.result?.[0]?.meta?.regularMarketPrice;

        if (price) return price;

        // 2️⃣ fallback (fintables radar)
        let res2 = await fetch("https://api.fintables.com/radar/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                filters: {type:"group",operator:"and",children:[]},
                columns: [{"attribute_id":"close"}]
            })
        });

        let json2 = await res2.json();

        let found = json2.data.find(x => x.code === symbol);
        return found?.close || null;

    } catch (e) {
        console.error("price error", e);
        return null;
    }
}
function getSignal(karar) {
    karar = normalizeKararLabel(karar);
    switch(karar) {
        case "GÜÇLÜ AL": return "🔥 GÜÇLÜ AL";
        case "AL": return "🟢 AL";
        case "TUT": return "🟡 TUT";
        case "NÖTR": return "⚪ NÖTR";
        case "ZAYIF": return "🟠 ZAYIF";
        case "SAT": return "🔴 SAT";
        default: return "❓";
    }
}

function parseBilancoDate(raw) {
    if (!raw) return null;

    const text = String(raw).trim();
    const now = new Date();
    now.setHours(0, 0, 0, 0);

    if (text === "Bugün" || text.toLowerCase() === "bugun") {
        return new Date(now);
    }

    if (text === "Dün" || text.toLowerCase() === "dun") {
        const d = new Date(now);
        d.setDate(d.getDate() - 1);
        return d;
    }

    const match = text.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (!match) return null;

    const day = Number(match[1]);
    const month = Number(match[2]) - 1;
    const year = Number(match[3]);
    const date = new Date(year, month, day);
    date.setHours(0, 0, 0, 0);
    return Number.isNaN(date.getTime()) ? null : date;
}

function formatBilancoDate(raw) {
    const date = parseBilancoDate(raw);
    if (!date) return raw || "YOK";

    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();
    return `${day}.${month}.${year}`;
}

function getMomentumLabel(m) {
    if (m > 10) return "🔥 Güçlü AL";
    if (m > 0) return "🟡 Orta";
    return "🔴 Zayıf";
}

function disableInfiniteMode() {
    activeListMode = null;
    infiniteListItems = [];
    infiniteRenderedCount = 0;
}

function formatCountWithDelta(baseValue, deltaValue) {
    const current = Number(baseValue) || 0;
    const delta = Number(deltaValue) || 0;

    if (!delta) return `${current}`;

    const previous = current - delta;
    if (delta > 0) return `${previous}<span class="delta-up">+${delta}</span>`;
    return `${previous}<span class="delta-down">${delta}</span>`;
}

/* autocomplete */
document.getElementById("symbol").addEventListener("input", function() {

    let value = this.value.toUpperCase().trim();
    let box = document.getElementById("suggestions");

    if (!value) {
        box.innerHTML = "";
        return;
    }

    let filtered = data
        .filter(x => x.Kod && x.Kod.toUpperCase().startsWith(value))
        .sort((a,b)=> (b.Score||0)-(a.Score||0))
        .slice(0,50);

    box.innerHTML = "";

    filtered.forEach(item => {

        let emoji = "🔴";
        if (item.Score > 0.75) emoji = "🔥";
        else if (item.Score > 0.65) emoji = "🟢";
        else if (item.Score > 0.45) emoji = "🟡";

        let div = document.createElement("div");
        div.className = "suggestion-item";
        div.innerText = `${emoji} ${item.Kod} (${item.Score?.toFixed(2)})`;

        div.onclick = () => {
            document.getElementById("symbol").value = item.Kod;
            box.innerHTML = "";
            search();
        };

        box.appendChild(div);
    });
});


async function loadPrices() {
    if (pricesLoaded) return;
    try {
        let res = await fetch("https://api.fintables.com/radar/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                filters: {type:"group",operator:"and",children:[]},
                columns: [{"attribute_id":"close"}]
            })
        });

        let json = await res.json();

        json.data.forEach(x => {
            livePrices[x.code] = x.close;
        });
        pricesLoaded = true;

    } catch (e) {
        console.error("price error", e);
    }
}

/* search */
async function search() {

    let s = document.getElementById("symbol").value.toUpperCase().replace(/\s+/g, "").trim();
    let stock = data.find(x => String(x.Kod || "").toUpperCase().replace(/\s+/g, "").trim() === s);

    if (!stock) {
        document.getElementById("result").innerHTML = "❌ Hisse bulunamadı";
        return;
    }

    let livePrice = livePrices[stock.Kod];
    if (!Number.isFinite(Number(livePrice)) || Number(livePrice) <= 0) {
        livePrice = await getLivePrice(stock.Kod);
        if (Number.isFinite(Number(livePrice)) && Number(livePrice) > 0) {
            livePrices[stock.Kod] = Number(livePrice);
        }
    }
    let displayFk = getDisplayFk(stock, livePrice);
    let displayPdDd = getDisplayPdDd(stock, livePrice);
    let pot = null;
    
    if (livePrice && stock.HedefFiyat) {
        pot = ((stock.HedefFiyat / livePrice) - 1) * 100;
    }
    // ------------------ CORE ------------------
    let score = stock.Score || 0;
    let scoreClamped = Math.min(score, 1);
    let scorePct = scoreClamped * 100;

    let karar = normalizeKararLabel(stock.karar || "NÖTR");
    let percent = scorePct;
    let color = getColor(karar);

    let cap = stock.SmallCap ? "⚠️ Düşük Sermaye<br>" : "";

    // ------------------ SCORE LABEL ------------------
    let scoreLabel =
        scoreClamped > 0.80 ? "elite" :
        scoreClamped > 0.70 ? "güçlü" :
        scoreClamped > 0.60 ? "iyi" :
        scoreClamped > 0.45 ? "orta" :
        "zayıf";

    // ------------------ KAR ISTIKRARI ------------------
    let istikrar = 1 - (stock.volatilite || 0);
    
    let istikrarLabel =
        istikrar > 0.7 ? "yüksek" :
        istikrar > 0.4 ? "orta" :
        "düşük";
    let growth = stock.ceyreklik_buyume || 0;
    
    let growthLabel =
        growth > 0.3 ? "çok güçlü" :
        growth > 0.15 ? "güçlü" :
        growth > 0.05 ? "orta" :
        growth > 0 ? "zayıf" :
        "negatif";
    // ------------------ KARLILIK ------------------
    let marginText = getProfitabilityText(stock);
    // ------------------ SEKTÖREL ------------------
    let marginRel = stock.margin_rel || 1;

    let marginRelLabel =
        marginRel > 1.5 ? "çok iyi" :
        marginRel > 1.1 ? "daha yüksek" :
        marginRel > 0.9 ? "ortalamada" :
        marginRel > 0.7 ? "düşük" :
        "zayıf";

    // ------------------ RENDER ------------------
    document.getElementById("result").innerHTML = `
        <div class="card">

            <div class="big">#${stock.Super_Rank ?? "-"} ${stock.Kod}</div>

            🏭 Sektör: ${stock.Sektor?.replace(/\n/g, " ") ?? "NA"}<br>

            💰 FK: ${displayFk?.toFixed(2) ?? "NA"} | 
            PD/DD: ${displayPdDd?.toFixed(2) ?? "NA"}<br>
            ${getFiiliDolasimText(stock)}<br>
            ${getIlkKurumSaklamaText(stock)}<br>
            ${getTakasAnalizText(stock)}<br>

            ${marginText}<br>
            
            📈 Büyüme: ${(growth * 100).toFixed(1)}% (${growthLabel})<br>
            📊 Sektöre Göre: ${marginRelLabel}<br>

            📅 Bilanço tarihi: ${formatBilancoDate(stock.Bilanco_Tarih)}<br>

            📉 Kâr İstikrarı: ${(istikrar * 100).toFixed(0)}% (${istikrarLabel})<br>

            📈 Trend: ${stock.trend ?? 0}/3<br>

            ${cap}

            👨‍💼 Analist: ${formatCountWithDelta(stock.AnalistSayisi, stock.AnalistDelta)}<br>
            📦 Model Portföy: ${stock.ModelPortfoy || 0}<br>
            🎯 Hedef Fiyat: ${stock.HedefFiyat ?? "YOK"} 
            (${pot ? pot.toFixed(2) + "%" : "NA"})<br>
            
            💵 Güncel Fiyat: ${livePrice ? livePrice.toFixed(2) : "NA"}<br>

            <div style="margin-top:6px; color:#94a3b8;">
                📌 ${stock.yorum ?? ""}
            </div>

            <br>

            <div class="score-row">
                <div class="big ${color}">
                    Score: ${scorePct.toFixed(0)} (${scoreLabel})
                </div>
                <div class="signal ${color}-bg">
                    ${getSignal(karar)}
                </div>
            </div>

            <div class="bar-container">
                <div class="bar" style="width:${percent}%"></div>
            </div>

            <br>

            <button onclick="toggleDetail('${stock.Kod}')">Çeyreklik Kârlar</button>

            <div id="d-${stock.Kod}" style="display:none; margin-top:10px;">
                Q1: ${stock.NetKar_Q1?.toFixed(2) ?? "-"} MTL<br>
                Q2: ${stock.NetKar_Q2?.toFixed(2) ?? "-"} MTL<br>
                Q3: ${stock.NetKar_Q3?.toFixed(2) ?? "-"} MTL<br>
                Q4: ${stock.NetKar_Q4?.toFixed(2) ?? "-"} MTL
            </div>

            <br>

        </div>
    `;
}
function buildTopListItem(s, options = {}) {
        let score = s.Score || 0;
        let scoreClamped = Math.min(score, 1);
        let scorePct = scoreClamped * 100;
        let percent = scorePct;

        let scoreLabel =
            scoreClamped > 0.80 ? "elite" :
            scoreClamped > 0.70 ? "güçlü" :
            scoreClamped > 0.60 ? "iyi" :
            scoreClamped > 0.45 ? "orta" :
            "zayıf";

        let cap = s.SmallCap ? "⚠️" : "";
        let marginText = getProfitabilityText(s);
        let marginRel = s.margin_rel || 1;
        let marginRelLabel =
            marginRel > 1.5 ? "çok iyi" :
            marginRel > 1.1 ? "daha yüksek" :
            marginRel > 0.9 ? "ortalamada" :
            marginRel > 0.7 ? "düşük" :
            "zayıf";

        const titlePrefix = options.titlePrefix ? `${options.titlePrefix} ` : `#${s.Super_Rank ?? "-"} `;
        const sectorIcon = options.sectorIcon || "🏭";
        const sectorLabel = options.sectorLabel || (s.Sektor?.replace(/\n/g, " ") ?? "NA");
        const extraLines = options.extraLines || s._extraLines || [];
        const comment = options.comment ?? s.yorum ?? "";
        const showDetail = options.showDetail !== false;

        return `
            <div class="list-item top-dynamic-item">

                <b>
                ${titlePrefix}
                <span class="hisse-link"
                      onclick="secHisse('${s.Kod}')">
                    ${s.Kod}
                </span>
                ${cap}
                </b><br>

                ${sectorIcon} ${sectorLabel}<br>

                💰 FK: ${getDisplayFk(s)?.toFixed(2) ?? "NA"} | 
                PD/DD: ${getDisplayPdDd(s)?.toFixed(2) ?? "NA"}<br>
                ${getFiiliDolasimText(s)}<br>
                ${getIlkKurumSaklamaText(s)}<br>
                ${getTakasAnalizText(s)}<br>

                ${marginText}<br>
                📊 Sektöre Göre: ${marginRelLabel}<br>
                ${extraLines.map(line => `${line}<br>`).join("")}
                🧠 Score: ${scorePct.toFixed(0)} (${scoreLabel})<br>
                
                <div style="margin-top:6px; color:#94a3b8;">
                📌 ${comment}
                </div>
                
                <div class="bar-container">
                    <div class="bar" style="width:${percent}%"></div>
                </div>

                ${showDetail ? `<button onclick="toggleDetail('${s.Kod}')">Çeyreklik Kârlar</button>

                <div id="d-${s.Kod}" style="display:none; margin-top:6px;">
                    Q1: ${s.NetKar_Q1?.toFixed(2) ?? "-"} MTL<br>
                    Q2: ${s.NetKar_Q2?.toFixed(2) ?? "-"} MTL<br>
                    Q3: ${s.NetKar_Q3?.toFixed(2) ?? "-"} MTL<br>
                    Q4: ${s.NetKar_Q4?.toFixed(2) ?? "-"} MTL
                </div>` : ""}

            </div>
        `;
}

async function showPortfolio() {
    disableInfiniteMode();
    document.getElementById("toplist").innerHTML = `
        <h3>📂 Hisselerim</h3>
        <div style="color:#94a3b8;">Portföy yükleniyor...</div>
    `;
    try {
        const holdings = await loadPortfolioHoldings();
        const sorted = [...data]
            .filter(s => holdings.has(String(s.Kod || "").toUpperCase()))
            .map(s => ({ ...s, _portfolioLot: holdings.get(String(s.Kod || "").toUpperCase()) }))
            .sort((a, b) => (a.Super_Rank ?? 9999) - (b.Super_Rank ?? 9999));

        let html = `<h3>📂 Hisselerim - ${sorted.length} hisse</h3>`;
        if (!sorted.length) {
            html += `<div style="color:#94a3b8;">Portföyde açık pozisyon bulunamadı.</div>`;
        } else {
            sorted.forEach(s => {
                html += buildTopListItem(s);
            });
        }
        document.getElementById("toplist").innerHTML = html;
    } catch (e) {
        console.error("PORTFOLIO LOAD ERROR:", e);
        document.getElementById("toplist").innerHTML = `
            <h3>📂 Hisselerim</h3>
            <div style="color:#fca5a5;">Portföy dosyası okunamadı.</div>
        `;
    }
}

function renderInfiniteTopChunk() {
    const nextItems = infiniteListItems.slice(
        infiniteRenderedCount,
        infiniteRenderedCount + infiniteBatchSize
    );

    if (!nextItems.length) return;

    const topList = document.getElementById("toplist");
    const listRoot = document.getElementById("toplist-items");
    if (!listRoot) return;

    listRoot.insertAdjacentHTML(
        "beforeend",
        nextItems.map(buildTopListItem).join("")
    );

    infiniteRenderedCount += nextItems.length;

    if (infiniteRenderedCount >= infiniteListItems.length) {
        const moreEl = document.getElementById("toplist-more");
        if (moreEl) {
            moreEl.textContent = "Tüm hisseler yüklendi";
        }
    }
}

function startInfiniteList(mode, title, items, introHtml = "") {
    activeListMode = mode;
    infiniteListItems = items;
    infiniteRenderedCount = 0;

    document.getElementById("toplist").innerHTML = `
        <h3>${title}</h3>
        ${introHtml}
        <div id="toplist-items"></div>
        <div id="toplist-more" style="margin-top:10px; color:#94a3b8;">Daha fazla hisse için aşağı kaydır</div>
    `;

    renderInfiniteTopChunk();
}

/* top list */
function showTop(n) {
    let sorted = [...data]
        .sort((a,b)=> {
            let ra = a.Super_Rank ?? 9999;
            let rb = b.Super_Rank ?? 9999;
            return ra - rb;
        });

    if (n === 10) {
        startInfiniteList("top-infinite", "📊 Hisseler", sorted);
        return;
    }

    disableInfiniteMode();
    sorted = sorted.slice(0,n);

    let html = "<h3>📊 Hisseler</h3>";

    sorted.forEach(s => {
        html += buildTopListItem(s);
    });

    document.getElementById("toplist").innerHTML = html;
}

function showRecentBilancos(n = null) {
    disableInfiniteMode();
    const now = new Date();
    now.setHours(0, 0, 0, 0);

    const threshold = new Date(now);
    threshold.setDate(threshold.getDate() - 10);

    let sorted = [...data]
        .filter(x => parseBilancoDate(x.Bilanco_Tarih))
        .map(x => ({ ...x, _bilancoDate: parseBilancoDate(x.Bilanco_Tarih) }))
        .filter(x => x._bilancoDate >= threshold)
        .sort((a, b) => b._bilancoDate - a._bilancoDate);

    if (Number.isFinite(Number(n)) && Number(n) > 0) {
        sorted = sorted.slice(0, Number(n));
    }

    let html = `<h3>📅 Son Bilançolar (10 Gün) - ${sorted.length} hisse</h3>`;

    sorted.forEach(s => {
        html += buildTopListItem(s, {
            titlePrefix: formatBilancoDate(s.Bilanco_Tarih),
            extraLines: [`📅 Bilanço tarihi: ${formatBilancoDate(s.Bilanco_Tarih)}`]
        });
    });

    document.getElementById("toplist").innerHTML = html;
}

function showBanks(n) {
    disableInfiniteMode();

    let sorted = [...data]
        .filter(x => x.Sektor?.includes("Bank"))
        .sort((a, b) => {
            let ra = a.Super_Rank ?? 9999;
            let rb = b.Super_Rank ?? 9999;
            return ra - rb;
        })
        .slice(0, n);

    let html = "<h3>🏦 Bankacılık Hisseleri</h3>";

    sorted.forEach(s => {
        let roe = Number(s.ROE || 0);
        let roeLabel =
            roe > 0.20 ? "çok güçlü" :
            roe > 0.15 ? "güçlü" :
            roe > 0.10 ? "iyi" :
            roe > 0 ? "zayıf" :
            "negatif";
        html += buildTopListItem(s, {
            sectorIcon: "🏦",
            extraLines: [`📊 ROE: ${(roe * 100).toFixed(1)}% (${roeLabel})`]
        });
    });

    document.getElementById("toplist").innerHTML = html;
}

function formatMarketCap(value) {
    const cap = Number(value);
    if (!Number.isFinite(cap) || cap <= 0) return "NA";

    if (cap >= 1000) {
        return `${(cap / 1000).toFixed(1)} milyar TL`;
    }

    return `${cap.toFixed(0)} mn TL`;
}

function getMarketCap(stock) {
    const directCap = Number(stock.PiyasaDegeri);
    if (Number.isFinite(directCap) && directCap > 0) return directCap;

    const price = Number(livePrices[stock.Kod] ?? stock.Fiyat);
    const sermaye = Number(stock.Sermaye);

    if (!Number.isFinite(price) || price <= 0) return null;
    if (!Number.isFinite(sermaye) || sermaye <= 0) return null;

    return (price * sermaye) / 1e6;
}

function showLargeCaps(limit = 50, poolSize = 100) {
    disableInfiniteMode();
    const largestPool = [...data]
        .map(x => ({ ...x, _marketCap: getMarketCap(x) }))
        .filter(x => Number.isFinite(Number(x._marketCap)) && Number(x._marketCap) > 0)
        .sort((a, b) => Number(b._marketCap) - Number(a._marketCap))
        .slice(0, poolSize);

    const sorted = largestPool
        .sort((a, b) => {
            const rankA = Number.isFinite(Number(a.Super_Rank)) ? Number(a.Super_Rank) : 9999;
            const rankB = Number.isFinite(Number(b.Super_Rank)) ? Number(b.Super_Rank) : 9999;

            if (rankA !== rankB) return rankA - rankB;
            return (Number(b.Score) || 0) - (Number(a.Score) || 0);
        })
        .slice(0, limit);

    let html = `<h3>🏛️ Güçlü Büyükler</h3>
                <div style="margin-bottom:10px; color:#94a3b8;">
                    Piyasa değeri en yüksek ${poolSize} hisse içinden, bilanço skoru en güçlü ${limit} hisse.
                </div>`;

    sorted.forEach(s => {
        html += buildTopListItem(s, {
            extraLines: [`🏦 Piyasa Değeri: ${formatMarketCap(s._marketCap)}`]
        });
    });

    document.getElementById("toplist").innerHTML = html;
}

function toggleDetail(kod) {
    let el = document.getElementById("d-" + kod);
    el.style.display = (el.style.display === "none") ? "block" : "none";
}
function secHisse(kod) {
    document.getElementById("symbol").value = kod;
    search();

    history.pushState(null, "", "?kod=" + kod);

    setTimeout(() => {
        document.getElementById("result").scrollIntoView({
            behavior: "smooth"
        });
    }, 100);
}
function smartScore(x) {
    let a = Number(x.AnalistSayisi) || 0;
    let m = Number(x.ModelPortfoy) || 0;
    let g = Number(x.PotansiyelGetiri) || 0;

    return Math.log1p(a) * Math.log1p(m) * (1 + g / 100);
}

function showByAnalyst() {
    disableInfiniteMode();

    let sorted = [...data]
        .filter(x => x.AnalistSayisi || x.ModelPortfoy || x.PotansiyelGetiri)
        .sort((a, b) => {
            const analystDiff = (Number(b.AnalistSayisi) || 0) - (Number(a.AnalistSayisi) || 0);
            if (analystDiff !== 0) return analystDiff;
            const scoreDiff = (Number(b.Score) || 0) - (Number(a.Score) || 0);
            if (scoreDiff !== 0) return scoreDiff;
            return smartScore(b) - smartScore(a);
        })
        .map(s => ({
            ...s,
            _extraLines: [
                `👨‍💼 Analist: ${formatCountWithDelta(s.AnalistSayisi, s.AnalistDelta)}`,
                `📦 Model Portföy: ${s.ModelPortfoy || 0}`,
                `🎯 Potansiyel Getiri: ${Number(s.PotansiyelGetiri || 0).toFixed(1)}%`
            ]
        }));

    startInfiniteList("analyst-infinite", "🧠 Smart Para (Analist + Model + Getiri)", sorted);
}

function showByTakas() {
    disableInfiniteMode();

    let sorted = [...data]
        .map(x => {
            const takas = getStrongestTakasChange(x);
            return { ...x, _takas: takas };
        })
        .filter(x => x._takas && Number.isFinite(x._takas.absPct) && x._takas.absPct > 0)
        .sort((a, b) => {
            const takasDiff = (b._takas?.absPct || 0) - (a._takas?.absPct || 0);
            if (takasDiff !== 0) return takasDiff;
            return (Number(b.Score) || 0) - (Number(a.Score) || 0);
        })
        .map(s => ({
            ...s,
            _extraLines: [
                `🏛️ En Güçlü Takas Değişimi: ${s._takas.pct > 0 ? "+" : "-"}%${Math.abs(s._takas.pct).toFixed(2)} ${s._takas.label}`
            ]
        }));

    startInfiniteList("takas-infinite", "📦 Takas Sıralaması", sorted);
}

function showZenginlik() {
    disableInfiniteMode();

    let sorted = [...data]
        .filter(s =>
            (Number(s.Score) || 0) > 0.70 &&
            isFiiliDolasimGreen(s) &&
            isIlkKurumSaklamaGreen(s) &&
            isTakasGreen(s)
        )
        .sort((a, b) => {
            const scoreDiff = (Number(b.Score) || 0) - (Number(a.Score) || 0);
            if (scoreDiff !== 0) return scoreDiff;
            return (Number(b.PotansiyelGetiri) || 0) - (Number(a.PotansiyelGetiri) || 0);
        });

    const intro = `
        <div style="margin-bottom:10px; color:#94a3b8;">
            Fiili dolaşım, ilk kurum saklama ve takas sinyali yeşil olan; skoru 70 üstü hisseler.
        </div>
    `;

    startInfiniteList("zenginlik-infinite", "💸 Zenginlik", sorted, intro);
}

window.addEventListener("scroll", () => {
    if (!activeListMode || !activeListMode.includes("infinite")) return;

    const scrollPosition = window.innerHeight + window.scrollY;
    const triggerPoint = document.body.offsetHeight - 300;

    if (scrollPosition >= triggerPoint) {
        renderInfiniteTopChunk();
    }
});

/* URL'den aç */
window.addEventListener("load", () => {
    const params = new URLSearchParams(window.location.search);
    const kod = params.get("kod");

    schedulePortfolioWarmup();

    if (kod) {
        document.getElementById("symbol").value = kod;
        setTimeout(() => search(), 300);
    }
});
</script>
