name: Update GCM Status

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

jobs:
  update-gcm-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build gcm_update_status.json
        env:
          GCM_QUARTER_LABEL: "2026 1. Çeyrek"
        run: python scripts/gcm_update_status.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gcm_update_status.json
          git diff --cached --quiet || git commit -m "Update GCM status"
          git push
